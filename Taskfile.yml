version: "3"

vars:
  # The next free ports from 8090, 7331 and 3000 up, so a second dev server
  # (another repo or worktree) never collides. 'task dev PORT=8091' wins.
  FREE_PORT:
    sh: port=8090; while nc -z localhost $port >/dev/null 2>&1; do port=$((port+1)); done; echo $port
  PORT: '{{.PORT | default .FREE_PORT}}'
  FREE_PROXY_PORT:
    sh: port=7331; while nc -z localhost $port >/dev/null 2>&1; do port=$((port+1)); done; echo $port
  PROXY_PORT: '{{.PROXY_PORT | default .FREE_PROXY_PORT}}'
  FREE_SHIKI_PORT:
    sh: port=3000; while nc -z localhost $port >/dev/null 2>&1; do port=$((port+1)); done; echo $port
  SHIKI_PORT: '{{.SHIKI_PORT | default .FREE_SHIKI_PORT}}'

tasks:
  # Development Tools
  templ:
    desc: Run templ with integrated server and hot reload
    env:
      # Rebases every self-referencing shadcn-templ.com URL (docs, llms.txt,
      # sitemap, robots) onto the local origin, see shared.Rebase.
      BASE_URL: http://localhost:{{.PORT}}
      PORT: "{{.PORT}}"
      SHIKI_URL: http://localhost:{{.SHIKI_PORT}}/highlight
    cmds:
      # templ binds its proxy to 127.0.0.1 by default; 0.0.0.0 makes the
      # live-reload proxy reachable from other machines (e.g. http://dev-01:7331).
      - go tool templ generate --watch --proxy="http://localhost:{{.PORT}}" --proxyport={{.PROXY_PORT}} --proxybind="0.0.0.0" --cmd="go run ./cmd/docs/main.go" --open-browser=false --log-level=error

  shiki-highlighter:
    desc: Start shiki syntax highlighter service
    dir: shiki
    env:
      PORT: "{{.SHIKI_PORT}}"
    cmds:
      - npm start

  tailwind-clean:
    desc: Clean tailwind output
    cmds:
      - "tailwindcss -i ./assets/css/globals.css -o ./assets/css/output.css --clean"

  scripts-watch:
    desc: Watch component scripts
    cmds:
      - go run ./cmd/shadcn-templ bundle --watch

  tailwind-watch:
    desc: Run tailwindcss in watch mode
    cmds:
      - "tailwindcss -i ./assets/css/globals.css -o ./assets/css/output.css --watch"

  dev:
    desc: Start development server with hot reload
    deps:
      - tailwind-clean
    cmds:
      - 'echo "Open http://localhost:{{.PROXY_PORT}}"'
      - task --parallel tailwind-watch scripts-watch templ shiki-highlighter PORT={{.PORT}} PROXY_PORT={{.PROXY_PORT}} SHIKI_PORT={{.SHIKI_PORT}}

  # Build & Validation
  templ-generate:
    desc: Compile templ files into Go
    cmds:
      - go tool templ generate

  # Generators
  generate-sitemap:
    desc: Generate sitemap.xml
    cmds:
      - go run ./cmd/sitemap/main.go --baseurl="https://shadcn-templ.com" --output="./static/sitemap.xml"

  generate-icons:
    desc: Generate icon definitions
    cmds:
      - go run cmd/icongen/main.go

  generate-llms:
    desc: Generate llms.txt from registry.json
    cmds:
      - go run cmd/generate-llms/main.go

  generate-style-classes:
    desc: Generate assets/css/style-classes.txt (Tailwind scan candidates for the compiled docs previews) from the vendored style css
    cmds:
      - go run ./cmd/generate-style-classes

  install-compinstall:
    desc: Install compinstall tool
    cmds:
      - go install ./cmd/compinstall

  install-shadcn-templ:
    desc: Install shadcn-templ CLI from the current local checkout
    cmds:
      - go install ./cmd/shadcn-templ
