version: "3"

vars:
  # The app port: an explicit 'task dev PORT=8091' wins, otherwise the next
  # free port from 8090 up. The templ proxy and the app share the result,
  # so hot reload never points at a foreign app.
  FREE_PORT:
    sh: port=8090; while nc -z localhost $port >/dev/null 2>&1; do port=$((port+1)); done; echo $port
  PORT: '{{.PORT | default .FREE_PORT}}'
  # The templ proxy port the same way, from 7331 up, so several apps run
  # side by side ('task dev PROXY_PORT=7340' wins).
  FREE_PROXY_PORT:
    sh: port=7331; while nc -z localhost $port >/dev/null 2>&1; do port=$((port+1)); done; echo $port
  PROXY_PORT: '{{.PROXY_PORT | default .FREE_PROXY_PORT}}'

tasks:
  templ:
    desc: Run templ with integrated server and hot reload
    cmds:
      - go tool templ generate --watch --proxy="http://localhost:{{.PORT}}" --proxyport={{.PROXY_PORT}} --cmd="go run ./main.go" --open-browser=false
    env:
      PORT: "{{.PORT}}"

  tailwind:
    desc: Watch Tailwind CSS changes
    cmds:
      - "tailwindcss -i ./assets/css/globals.css -o ./assets/css/output.css --watch"

  scripts-watch:
    desc: Watch component scripts
    cmds:
      - go tool shadcn-templ bundle --watch

  build:
    desc: Build the application with production assets
    cmds:
      - tailwindcss -i ./assets/css/globals.css -o ./assets/css/output.css --minify
      - go tool shadcn-templ bundle
      - go tool templ generate
      - go build -o bin/app .

  dev:
    env:
      SHADCN_TEMPL_DEV: "true"
    desc: Start development server with hot reload
    cmds:
      # The ports are picked once here and passed on, so the parallel run
      # and an explicit 'task dev PORT=... PROXY_PORT=...' agree.
      - task --parallel tailwind scripts-watch templ PORT={{.PORT}} PROXY_PORT={{.PROXY_PORT}}
