name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: production-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04-arm
    environment: production
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ghcr.io/axadrn/shadcn-templ:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Connect to the server through Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ vars.TS_CLIENT_ID }}
          audience: api.tailscale.com/${{ vars.TS_CLIENT_ID }}
          tags: tag:ci
          ping: ${{ vars.DEPLOY_HOST }}

      - name: Sync Compose file
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          tailscale ssh "root@${DEPLOY_HOST}" \
            'mkdir -p /opt/apps/shadcn-templ.com && cat > /opt/apps/shadcn-templ.com/compose.yml' \
            < compose.yml

      - name: Deploy and wait for health
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          tailscale ssh "root@${DEPLOY_HOST}" \
            "cd /opt/apps/shadcn-templ.com && IMAGE_TAG=${GITHUB_SHA} docker compose up -d --pull always --wait --wait-timeout 120"
