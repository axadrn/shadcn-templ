name: deploy-v1

on:
  push:
    branches: [v1]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: production-v1
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04-arm
    environment: production
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ghcr.io/axadrn/shadcn-templ:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Connect to prod-01 through Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: TA5fRdgvFU11CNTRL-kNv89UsXK811CNTRL
          audience: api.tailscale.com/TA5fRdgvFU11CNTRL-kNv89UsXK811CNTRL
          tags: tag:ci
          ping: prod-01

      - name: Sync Compose file
        run: |
          tailscale ssh root@prod-01 \
            'mkdir -p /opt/apps/templui.io && cat > /opt/apps/templui.io/compose.yml' \
            < compose.yml

      - name: Deploy and wait for health
        run: |
          tailscale ssh root@prod-01 \
            "cd /opt/apps/templui.io && IMAGE_TAG=${GITHUB_SHA} docker compose up -d --pull always --wait --wait-timeout 120"
